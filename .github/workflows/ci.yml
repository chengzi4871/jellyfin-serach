name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt pytest httpx
      - run: pytest -q
      - run: python worker_test.py

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build plugin/Jellyfin.Plugin.VisualSearch/Jellyfin.Plugin.VisualSearch.csproj --configuration Release
      - run: dotnet publish plugin/Jellyfin.Plugin.VisualSearch/Jellyfin.Plugin.VisualSearch.csproj --configuration Release --output publish
      - run: cp plugin/Jellyfin.Plugin.VisualSearch/meta.json publish/meta.json
      - run: cd publish && zip -r ../visual-search-plugin.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: visual-search-plugin
          path: visual-search-plugin.zip

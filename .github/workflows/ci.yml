name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt pytest httpx
      - run: pytest -q
      - run: python worker_test.py

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build plugin/Jellyfin.Plugin.VisualSearch/Jellyfin.Plugin.VisualSearch.csproj --configuration Release
      - run: dotnet publish plugin/Jellyfin.Plugin.VisualSearch/Jellyfin.Plugin.VisualSearch.csproj --configuration Release --output publish
      - name: Verify plugin dependencies
        run: |
          test -s publish/Jellyfin.Plugin.VisualSearch.dll
          test -s publish/Jellyfin.Plugin.VisualSearch.pdb
          test -s publish/SixLabors.ImageSharp.dll
      - name: Build minimal plugin package
        run: |
          rm -rf plugin-package
          mkdir plugin-package
          cp publish/Jellyfin.Plugin.VisualSearch.dll plugin-package/
          cp publish/Jellyfin.Plugin.VisualSearch.pdb plugin-package/
          cp publish/SixLabors.ImageSharp.dll plugin-package/
          cp plugin/Jellyfin.Plugin.VisualSearch/meta.json plugin-package/
          test "$(find plugin-package -maxdepth 1 -type f | wc -l)" -eq 4
          cd plugin-package && zip -q -r ../visual-search-plugin.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: visual-search-plugin
          path: visual-search-plugin.zip

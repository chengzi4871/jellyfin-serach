<div id="VisualSearchConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button">
<div data-role="content"><div class="content-primary" style="padding:1em">
<h2>Visual Search</h2>
<p>插件直接调用云端多模态 Embedding API 和 Qdrant，不需要 Worker，也不读取环境变量。API Key 会保存在 Jellyfin 插件配置中，请确保配置文件权限合适。</p>
<label>Embedding Base URL <input id="embeddingBaseUrl" style="width:28em" placeholder="https://example.com/v1"></label><br><br>
<label>Embedding Model <input id="embeddingModel" style="width:28em" placeholder="多模态嵌入模型名称"></label><br><br>
<label>API Key <input id="embeddingApiKey" type="password" autocomplete="off" style="width:28em"></label><br><br>
<label>Protocol <select id="embeddingProtocol"><option value="openai_multimodal">OpenAI-compatible multimodal</option><option value="plain">Plain input</option></select></label><br><br>
<label>Embedding dimension <input id="embeddingDimension" type="number" min="1" max="32768"></label>
<label>Timeout seconds <input id="embeddingTimeout" type="number" min="5" max="300"></label><br><br>
<label>Qdrant URL <input id="qdrantUrl" style="width:28em"></label><br><br>
<label>Frames per video <input id="frames" type="number" min="1" max="100"></label><br><br>
<label>Visual weight <input id="visual" type="number" min="0" max="1" step="0.05"></label><br><br>
<label>Title weight <input id="title" type="number" min="0" max="1" step="0.05"></label><br><br>
<button id="save">保存</button> <button id="ensure">初始化 Qdrant</button> <button id="health">测试云端与 Qdrant</button> <button id="probe">小批量安全测试</button><br><br>
<section style="margin-top:1em;border:1px solid #aaa;padding:1em;max-width:1100px">
<h3>语义能力验收（不写入正式索引）</h3>
<p>随机抽取少量视频，展示实际送入模型的标题和单帧图片；输入多个查询词后查看它们与每一帧的余弦相似度。查询示例：沙滩上的猛男、沙滩上的美女、红色比基尼、蓝色比基尼、黑发、金发。</p>
<label>视频数 <input id="inspectCount" type="number" min="1" max="10" value="2"></label>
<label style="margin-left:1em">每个视频帧数 <input id="inspectFrames" type="number" min="1" max="8" value="3"></label><br><br>
<label style="display:block">查询词（每行一个）<br><textarea id="inspectQueries" rows="4" style="width:34em">沙滩上的猛男
沙滩上的美女
红色比基尼
蓝色比基尼
黑发
金发</textarea></label><br>
<button id="inspect">开始语义对比</button> <span id="inspectStatus"></span>
<div id="inspectResults"></div>
</section><br>
<button id="incremental">开始增量索引</button> <button id="rebuild">完整重建</button> <button id="cancel">取消</button> <span id="status"></span>
<script type="text/javascript">
(async function(){
 const id='5e1d5d27-2a38-4b4f-9d5e-0dba1e3b4b18';
 const page=document.getElementById('VisualSearchConfigPage');
 const embeddingBaseUrl=page.querySelector('#embeddingBaseUrl'), embeddingModel=page.querySelector('#embeddingModel'), embeddingApiKey=page.querySelector('#embeddingApiKey'), embeddingProtocol=page.querySelector('#embeddingProtocol'), embeddingDimension=page.querySelector('#embeddingDimension'), embeddingTimeout=page.querySelector('#embeddingTimeout'), qdrantUrl=page.querySelector('#qdrantUrl'), frames=page.querySelector('#frames'), visual=page.querySelector('#visual'), title=page.querySelector('#title');
 const saveButton=page.querySelector('#save'), ensureButton=page.querySelector('#ensure'), healthButton=page.querySelector('#health'), probeButton=page.querySelector('#probe'), inspectButton=page.querySelector('#inspect'), inspectCount=page.querySelector('#inspectCount'), inspectFrames=page.querySelector('#inspectFrames'), inspectQueries=page.querySelector('#inspectQueries'), inspectStatus=page.querySelector('#inspectStatus'), inspectResults=page.querySelector('#inspectResults'), incrementalButton=page.querySelector('#incremental'), rebuildButton=page.querySelector('#rebuild'), cancelButton=page.querySelector('#cancel'), statusText=page.querySelector('#status');
 const cfg=await ApiClient.getJSON(ApiClient.getUrl('Plugins/'+id+'/Configuration'));
 embeddingBaseUrl.value=cfg.EmbeddingBaseUrl||''; embeddingModel.value=cfg.EmbeddingModel||''; embeddingApiKey.value=cfg.EmbeddingApiKey||''; embeddingProtocol.value=cfg.EmbeddingProtocol||'openai_multimodal'; embeddingDimension.value=cfg.EmbeddingDimension||1024; embeddingTimeout.value=cfg.EmbeddingTimeoutSeconds||60; qdrantUrl.value=cfg.QdrantUrl||'http://127.0.0.1:6333';
 frames.value=cfg.FramesPerVideo||12; visual.value=cfg.VisualWeight??.75; title.value=cfg.TitleWeight??.25;
 saveButton.onclick=async()=>{cfg.EmbeddingBaseUrl=embeddingBaseUrl.value.trim();cfg.EmbeddingModel=embeddingModel.value.trim();if(embeddingApiKey.value)cfg.EmbeddingApiKey=embeddingApiKey.value;cfg.EmbeddingProtocol=embeddingProtocol.value;cfg.EmbeddingDimension=+embeddingDimension.value;cfg.EmbeddingTimeoutSeconds=+embeddingTimeout.value;cfg.QdrantUrl=qdrantUrl.value.trim();cfg.FramesPerVideo=+frames.value;cfg.VisualWeight=+visual.value;cfg.TitleWeight=+title.value;await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('Plugins/'+id+'/Configuration'),data:JSON.stringify(cfg),contentType:'application/json'});statusText.textContent='已保存';};
 ensureButton.onclick=async()=>{await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('VisualSearch/Index/Ensure')});statusText.textContent='Qdrant Collection 已初始化';};
 healthButton.onclick=async()=>{const x=await ApiClient.getJSON(ApiClient.getUrl('VisualSearch/Health'));statusText.textContent='云端与 Qdrant: '+x.status;};
 probeButton.onclick=async()=>{const n=+(prompt('随机测试几个视频？建议 1～3 个','3')||'3');const f=+(prompt('每个视频测试几张 Trickplay 图？建议 1～2 张','2')||'2');statusText.textContent='正在测试云端文本和图片嵌入，请稍候…';try{const x=await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('VisualSearch/Test/Random'),data:JSON.stringify({count:n,framesPerVideo:f}),contentType:'application/json'});statusText.textContent='测试完成：'+(x.testedVideos||0)+' 个视频；请查看浏览器网络响应中的 results。';console.log('VisualSearch probe',x);}catch(e){statusText.textContent='测试失败：'+(e.message||e);}};
 inspectButton.onclick=async()=>{const queries=inspectQueries.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!queries.length){inspectStatus.textContent='请至少输入一个查询词';return;}inspectStatus.textContent='正在生成测试向量并计算相似度…';inspectResults.innerHTML='';try{const x=await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('VisualSearch/Test/Inspect'),data:JSON.stringify({count:+inspectCount.value,framesPerVideo:+inspectFrames.value,queries}),contentType:'application/json'});inspectStatus.textContent='完成：'+x.count+' 个视频；相似度越高表示模型越接近该查询。';renderInspect(x);}catch(e){inspectStatus.textContent='测试失败：'+(e.message||e);}};
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function renderInspect(data){let html='';(data.results||[]).forEach(v=>{html+='<article style="margin:1em 0;padding:1em;border:1px solid #bbb"><h4>'+esc(v.title)+'</h4><details open><summary>实际标题输入、标题相似度与向量摘要</summary><pre style="white-space:pre-wrap">'+esc(v.titleInput)+'\n查询→标题：'+Object.entries(v.titleQueryScores||{}).map(([q,s])=>esc(q)+': '+Number(s).toFixed(4)).join('； ')+'\n维度: '+v.titleVector.dimension+'  范数: '+(v.titleVector.norm||0).toFixed(4)+'  范围: '+(v.titleVector.min||0).toFixed(4)+' … '+(v.titleVector.max||0).toFixed(4)+'\n前8维: '+esc((v.titleVector.firstValues||[]).map(n=>Number(n).toFixed(5)).join(', '))+'</pre></details><div style="display:flex;flex-wrap:wrap;gap:12px">';(v.frames||[]).forEach(f=>{html+='<div style="width:260px"><img src="'+f.imageDataUrl+'" style="width:250px;height:auto;display:block;background:#222"><small>Frame '+f.frameIndex+' · '+formatMs(f.timestampMs)+'<br>向量维度 '+f.vector.dimension+'，范数 '+(f.vector.norm||0).toFixed(4)+'<br>'+Object.entries(f.queryScores||{}).map(([q,s])=>esc(q)+': <b>'+Number(s).toFixed(4)+'</b>').join('<br>')+'</small></div>';});html+='</div></article>';});inspectResults.innerHTML=html;}
 function formatMs(ms){const s=Math.floor((ms||0)/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
 incrementalButton.onclick=async()=>{await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('VisualSearch/Index/Incremental')});statusText.textContent='索引任务已排队';};
 rebuildButton.onclick=async()=>{if(confirm('完整重建会重新处理全部视频，确定继续？')){await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('VisualSearch/Index/Rebuild')});statusText.textContent='重建任务已排队';}};
 cancelButton.onclick=async()=>{await ApiClient.ajax({type:'POST',url:ApiClient.getUrl('VisualSearch/Index/Cancel')});statusText.textContent='已取消';};
})();
</script>
</div></div></div>
